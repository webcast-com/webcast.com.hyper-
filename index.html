<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Auto Blog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
    }

    header {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 20px 16px;
      padding-top: max(20px, env(safe-area-inset-top));
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.2;
    }
    header p {
      margin: 6px 0 0;
      color: #bbb;
      font-size: 0.95rem;
    }

    #posts {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .post {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      overflow-wrap: anywhere;
    }
    .post img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .post h2 {
      margin-top: 0;
      font-size: 1.3rem;
      line-height: 1.3;
    }
    .post h2 a {
      text-decoration: none;
      color: #0073e6;
    }
    .post small {
      color: gray;
      display: block;
      margin-bottom: 10px;
    }
    .post p {
      margin: 0;
      line-height: 1.5;
      color: #333;
    }

    footer {
      text-align: center;
      padding: 15px;
      padding-bottom: max(15px, env(safe-area-inset-bottom));
      background: #222;
      color: #fff;
      margin-top: 40px;
    }

    /* Modal container */
    #imgModal {
      display: none;
      position: fixed;
      z-index: 9999;
      padding-top: 60px;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: rgba(0,0,0,0.9);
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    #imgModal img {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }
    #imgModal #closeModal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    /* Next & Prev buttons */
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px;
      color: white;
      font-weight: bold;
      font-size: 40px;
      transition: 0.3s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .prev { left: 0; }
    .next { right: 0; }
    .prev:hover, .next:hover { color: #ccc; }

    /* ---------- Mobile layout ---------- */
    @media (max-width: 600px) {
      header { padding: 16px 12px; }
      header h1 { font-size: 1.4rem; }
      header p { font-size: 0.85rem; }

      #posts { margin: 16px auto; padding: 0 12px; }

      .post { padding: 14px; margin-bottom: 14px; border-radius: 8px; }
      .post h2 { font-size: 1.1rem; }

      /* Larger tap targets for the modal arrows */
      .prev, .next { font-size: 30px; padding: 18px 14px; }
      #imgModal { padding-top: 48px; }
      #imgModal #closeModal { top: 12px; right: 18px; font-size: 34px; }
      #imgModal img { max-width: 95%; max-height: 75%; }
    }

    @media (max-width: 360px) {
      header h1 { font-size: 1.2rem; }
      .post h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Auto Blog</h1>
    <p>Powered by RSS Feeds</p>
  </header>

  <section id="posts">
    <p>Loading posts...</p>
  </section>

  <footer>
    <p>&copy; 2025 My Auto Blog</p>
  </footer>

  <!-- Modal -->
  <div id="imgModal">
    <span id="closeModal">&times;</span>
    <img id="modalImg" src="" alt="Enlarged post image">
    <a class="prev" onclick="changeImage(-1)">&#10094;</a>
    <a class="next" onclick="changeImage(1)">&#10095;</a>
  </div>

  <script>
    // Add your RSS feed URLs here
    const feeds = [
      "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",
      "https://feeds.bbci.co.uk/news/rss.xml",
      "https://www.xvideos.com/tags/xxx-porn/rss.xml"
    ];

    const container = document.getElementById("posts");
    let images = [];
    let currentIndex = 0;

    // Strip HTML tags so feed descriptions can't break the mobile layout
    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html || "";
      return (tmp.textContent || tmp.innerText || "").trim();
    }

    async function fetchFeed(url) {
      const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
      const res = await fetch(api);
      return res.json();
    }

    async function loadPosts() {
      container.innerHTML = "";
      let articles = [];

      for (let feed of feeds) {
        try {
          let data = await fetchFeed(feed);
          (data.items || []).forEach(item => {
            articles.push({
              title: item.title,
              link: item.link,
              date: new Date(item.pubDate),
              description: item.description || "",
              source: data.feed?.title || feed,
              image: item.enclosure?.link || item.enclosure?.url ||
                     (item.content || "").match(/<img[^>]+src="([^">]+)"/)?.[1] || null
            });
          });
        } catch (err) {
          console.error("Error fetching feed:", feed, err);
        }
      }

      // Sort by latest
      articles.sort((a, b) => b.date - a.date);

      images = articles.map(a => a.image || "https://via.placeholder.com/800x400?text=No+Image");

      if (articles.length === 0) {
        container.innerHTML = "<p>No posts could be loaded right now.</p>";
        return;
      }

      articles.forEach((post, index) => {
        const div = document.createElement("div");
        div.className = "post";
        const imgHtml = post.image
          ? `<img src="${post.image}" alt="Post image" onclick="openModal(${index})">`
          : "";
        div.innerHTML = `
          ${imgHtml}
          <h2><a href="${post.link}" target="_blank" rel="noopener">${post.title}</a></h2>
          <small>${post.date.toDateString()} — ${post.source}</small>
          <p>${stripHtml(post.description).substring(0, 200)}...</p>
        `;
        container.appendChild(div);
      });
    }

    function openModal(index) {
      currentIndex = index;
      document.getElementById("modalImg").src = images[currentIndex];
      document.getElementById("imgModal").style.display = "block";
    }

    function changeImage(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = images.length - 1;
      if (currentIndex >= images.length) currentIndex = 0;
      document.getElementById("modalImg").src = images[currentIndex];
    }

    document.getElementById("closeModal").onclick = function () {
      document.getElementById("imgModal").style.display = "none";
    };

    window.onclick = function (event) {
      const modal = document.getElementById("imgModal");
      if (event.target === modal) modal.style.display = "none";
    };

    loadPosts();
  </script>
</body>
</html>
